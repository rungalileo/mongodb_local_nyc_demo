name: Publish container images

# Builds and pushes the two demo images to GitHub Container Registry so a
# Kubernetes cluster can pull them without access to this repo.
#
# Images are published under this repo's own owner, so the automatic
# GITHUB_TOKEN is sufficient -- no PAT or extra secrets to maintain, and the
# packages stay linked to this repo for provenance. The deployment plan allows
# any public registry; the o11y-field-demos README points here for the source,
# so serving the images from the same org keeps that story consistent.
#
# After the first successful run, make both packages public once:
#   repo -> Packages -> voltway-api / voltway-web -> Package settings ->
#   Change visibility -> Public
# Otherwise the cluster needs an imagePullSecret.

on:
  push:
    branches:
      - promo-hallucination-clarity
      - main
    tags:
      - "v*"
    # Skip doc-only pushes; nothing in the images changes.
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: voltway-api
            context: ai-ops-desk
          - name: voltway-web
            context: ai-ops-desk-web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Lowercase owner: ghcr.io rejects uppercase repository names.
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ github.ref_name == 'promo-hallucination-clarity' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          # linux/amd64 only: the k3d EC2 target is x86_64, and the backend
          # build compiles native wheels, so adding arm64 under QEMU would make
          # CI several times slower for no benefit.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Summarise
        run: |
          echo "### ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
