# Non-sensitive configuration. Credentials belong in the Secret instead.
#
# IMPORTANT: do NOT wrap values in quotes here. The repo's .env file quotes its
# values and python-dotenv strips them, but Kubernetes passes ConfigMap values
# through verbatim — a quoted "mongodb+srv://..." arrives with the quotes still
# attached and fails with "Invalid URI scheme".
apiVersion: v1
kind: ConfigMap
metadata:
  name: voltway-config
  namespace: voltway
data:
  # --- Galileo -------------------------------------------------------------
  # These must be a matched pair, and GALILEO_API_KEY must be issued for that
  # same stack. A mismatch is NOT a degraded-tracing situation -- the Galileo
  # client is initialised on the request path, so a 401 there aborts the whole
  # chat and the UI shows only an error event. Verified by deploying with a
  # mismatched pair: every request failed with
  #   "Galileo API returned HTTP status code 401 ... Invalid credentials."
  #
  # This is the stack the demo runs against. Keep both on demo.sao, matching
  # ai-ops-desk/.env. Any other stack also needs its own GALILEO_API_KEY; see
  # DEPLOY-K8S.md before changing these.
  GALILEO_CONSOLE_URL: https://console.demo.sao.splunkcloud.com
  GALILEO_API_URL: https://api.demo.sao.splunkcloud.com
  GALILEO_PROJECT: volt-assistant
  GALILEO_LOG_STREAM: Default

  # --- Agent Control (enterprise / ACE) ------------------------------------
  # enterprise mode reuses GALILEO_API_KEY as the AC credential, so no separate
  # Agent Control key is needed. Controls bind to a log stream, not an agent.
  #
  # Note this is deliberately a DIFFERENT host from GALILEO_API_URL above --
  # that is how the working local config is set up, so don't "fix" it to match.
  AGENT_CONTROL_MODE: enterprise
  AGENT_CONTROL_ENABLED: "true"
  AGENT_CONTROL_URL: https://agent-control.demo-v2.galileocloud.io
  AGENT_CONTROL_AGENT_NAME: ai-ops-desk
  AGENT_CONTROL_TARGET_TYPE: log_stream
  AGENT_CONTROL_RUNTIME_AUTH_MODE: jwt
  AGENT_CONTROL_API_KEY_HEADER: Galileo-API-Key
  # 5s instead of the SDK's 60s so toggling a control in the Console takes
  # effect fast enough to demo live.
  AGENT_CONTROL_REFRESH_INTERVAL_SECONDS: "5"

  # --- App -----------------------------------------------------------------
  # The browser calls /api/* on its own origin and the Ingress forwards it, so
  # requests are same-origin and CORS never applies. Kept as a safety net in
  # case the backend is ever exposed on a separate hostname.
  ALLOWED_ORIGINS: https://voltway.splunko11y.com

  # Where the Ops drawer persists its "live target" pin. Must be inside the
  # writable /data mount, not the read-only app directory.
  PROMO_DEMO_STATE_FILE: /data/.galileo_active_target.json
