# HTTP Basic Auth in front of the whole demo, so a public URL is not wide open.
# Follows the same pattern as the healthcare-assistant demo in
# splunk/observability-workshop.
#
# This is a Traefik CRD, not a core Kubernetes object, so it only works on a
# cluster running Traefik (which the o11y-field-demos k3d instances do). On
# ingress-nginx the equivalent is three annotations on the Ingress:
#   nginx.ingress.kubernetes.io/auth-type: basic
#   nginx.ingress.kubernetes.io/auth-secret: voltway-basicauth
#   nginx.ingress.kubernetes.io/auth-realm: "Voltway demo"
#
# The Ingress opts in via:
#   traefik.ingress.kubernetes.io/router.middlewares: voltway-basicauth@kubernetescrd
# where the value is <namespace>-<middleware-name>@kubernetescrd -- so the
# "voltway-" prefix is the NAMESPACE, not part of the middleware name. Getting
# this wrong gives a 404 from Traefik rather than an auth prompt.
#
# Create the credentials Secret with deploy/scripts/set-password.sh, which
# generates a bcrypt hash. Basic auth sends the password on every request, so it
# is only meaningful over HTTPS -- fine here, since the Ingress terminates TLS.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: basicauth
  namespace: voltway
  labels:
    app.kubernetes.io/part-of: voltway-demo
spec:
  basicAuth:
    # Key must be `users`; Traefik's default for the secret's htpasswd data.
    secret: voltway-basicauth
    realm: Voltway demo
