apiVersion: apps/v1
kind: Deployment
metadata:
  name: voltway-api
  namespace: voltway
  labels:
    app.kubernetes.io/name: voltway-api
    app.kubernetes.io/part-of: voltway-demo
spec:
  # MUST stay at 1. The Ops drawer mutates os.environ in-process to repoint the
  # live Galileo target, and the integration-cost job lives in module-level
  # state plus a background thread. With more than one replica a button press
  # and its follow-up status poll can land on different pods, so the UI reports
  # nonsense and traces go to the wrong project.
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate: two pods must never run at once, otherwise a
    # rollout briefly reintroduces the split-state problem above.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: voltway-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: voltway-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          # Pin to an immutable tag (sha-<commit>) for anything you care about
          # reproducing; :latest is here for convenience during setup.
          image: ghcr.io/rungalileo/voltway-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: voltway-config
            - secretRef:
                name: voltway-secrets
          # /api/health is dependency-free (no DB, no outbound calls), so these
          # probes report process health only and won't restart the pod just
          # because Atlas or OpenAI is briefly unreachable.
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            # Importing langgraph/openai/galileo takes ~15s; allow up to 90s
            # before the kubelet gives up.
            periodSeconds: 5
            failureThreshold: 18
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: state
              mountPath: /data
      volumes:
        # The live-target pin is a convenience, not a source of truth: losing it
        # on restart just reverts to GALILEO_PROJECT from the ConfigMap, and the
        # app self-heals if the pinned project was deleted. emptyDir is enough;
        # swap for a PVC only if the pin must survive pod replacement.
        - name: state
          emptyDir: {}
