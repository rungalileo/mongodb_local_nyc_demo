# TEMPLATE ONLY — placeholders, never real credentials. Do not commit a filled-in
# copy of this file.
#
# Prefer creating the Secret imperatively so values never touch git. Reading them
# with `read -rs` keeps them out of your shell history too:
#
#   read -rsp 'Atlas connection string: ' MONGODB_URI; echo
#   read -rsp 'OpenAI API key: ' OPENAI_API_KEY; echo
#   read -rsp 'Galileo API key: ' GALILEO_API_KEY; echo
#
#   kubectl -n voltway create secret generic voltway-secrets \
#     --from-literal=MONGODB_URI="$MONGODB_URI" \
#     --from-literal=OPENAI_API_KEY="$OPENAI_API_KEY" \
#     --from-literal=GALILEO_API_KEY="$GALILEO_API_KEY"
#
# Use stringData (not data) if you do apply this file — stringData takes plain
# text, so no base64 step. Every value below is an empty string you fill in, and
# the quotes must go when you do: Kubernetes passes values through verbatim, so a
# quoted connection string arrives with its quotes attached and fails with
# "Invalid URI scheme".
apiVersion: v1
kind: Secret
metadata:
  name: voltway-secrets
  namespace: voltway
type: Opaque
stringData:
  # Atlas SRV connection string, copied from Atlas -> Connect -> Drivers. It
  # embeds the database username and password, which is why it belongs here and
  # not in the ConfigMap. It must be Atlas rather than a self-hosted MongoDB,
  # because the policy RAG path uses $vectorSearch. Remember to allow the
  # cluster's egress IP in Atlas Network Access.
  #
  # Left empty on purpose: a realistic-looking connection string here trips
  # GitHub secret scanning, which cannot tell a placeholder from a live one.
  MONGODB_URI: ""

  OPENAI_API_KEY: ""

  # Must be issued for the stack named in the ConfigMap's GALILEO_API_URL. Also
  # doubles as the Agent Control credential in enterprise mode.
  GALILEO_API_KEY: ""

  # Only needed if AGENT_CONTROL_MODE is switched to "oss" (self-hosted AC
  # server). Enterprise/ACE mode does not use these — leave them out.
  # AGENT_CONTROL_API_KEY: ""
  # AGENT_CONTROL_ADMIN_API_KEY: ""
