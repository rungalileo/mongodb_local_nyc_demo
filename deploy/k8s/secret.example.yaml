# TEMPLATE ONLY — placeholders, never real credentials. Do not commit a filled-in
# copy of this file.
#
# Prefer creating the Secret imperatively so values never touch git:
#
#   kubectl -n voltway create secret generic voltway-secrets \
#     --from-literal=MONGODB_URI='mongodb+srv://USER:PASS@cluster.mongodb.net/?retryWrites=true&w=majority' \
#     --from-literal=OPENAI_API_KEY='sk-proj-...' \
#     --from-literal=GALILEO_API_KEY='...'
#
# Use stringData (not data) if you do apply this file — stringData takes plain
# text, so no base64 step. Do not quote the values: Kubernetes passes them
# verbatim and a quoted URI fails with "Invalid URI scheme".
apiVersion: v1
kind: Secret
metadata:
  name: voltway-secrets
  namespace: voltway
type: Opaque
stringData:
  # Atlas connection string — contains credentials, and must be Atlas rather
  # than a self-hosted MongoDB because the policy RAG path uses $vectorSearch.
  # Remember to allow the cluster's egress IP in Atlas Network Access.
  MONGODB_URI: mongodb+srv://REPLACE_USER:REPLACE_PASSWORD@REPLACE_CLUSTER.mongodb.net/?retryWrites=true&w=majority

  OPENAI_API_KEY: REPLACE_WITH_OPENAI_KEY

  # Also doubles as the Agent Control credential in enterprise mode.
  GALILEO_API_KEY: REPLACE_WITH_GALILEO_API_KEY

  # Only needed if AGENT_CONTROL_MODE is switched to "oss" (self-hosted AC
  # server). Enterprise/ACE mode does not use these — leave them out.
  # AGENT_CONTROL_API_KEY: REPLACE_ME
  # AGENT_CONTROL_ADMIN_API_KEY: REPLACE_ME
