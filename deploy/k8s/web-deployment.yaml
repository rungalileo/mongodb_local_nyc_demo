apiVersion: apps/v1
kind: Deployment
metadata:
  name: voltway-web
  namespace: voltway
  labels:
    app.kubernetes.io/name: voltway-web
    app.kubernetes.io/part-of: voltway-demo
spec:
  # Stateless, so this can be scaled up safely — unlike voltway-api. Kept at 1
  # because a demo storefront has no need for more.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: voltway-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: voltway-web
    spec:
      securityContext:
        runAsNonRoot: true
        # `node` in the official image.
        runAsUser: 1000
      containers:
        - name: web
          image: ghcr.io/rungalileo/voltway-web:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            # Next.js standalone server.js reads both of these.
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: 0.0.0.0
            # Deliberately NOT setting NEXT_PUBLIC_API_URL. It is inlined at
            # image build time, so setting it here would have no effect anyway;
            # the bundle calls /api/* on its own origin and the Ingress routes
            # it to voltway-api.
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
