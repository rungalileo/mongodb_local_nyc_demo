# Local smoke-test overlay for a k3d cluster. Deliberately minimal: it changes
# only what cannot work off-cluster, so what you test is as close as possible to
# what deploys for real.
#
#   k3d cluster create voltway-test --agents 1 \
#     --port "8080:80@loadbalancer" --port "8443:443@loadbalancer" \
#     --image rancher/k3s:v1.33.4-k3s1
#   docker build -t voltway-api:local ai-ops-desk
#   docker build -t voltway-web:local ai-ops-desk-web
#   k3d image import voltway-api:local voltway-web:local -c voltway-test
#   kubectl apply -f deploy/k8s/namespace.yaml
#   kubectl -n voltway create secret generic voltway-secrets --from-literal=...
#   kubectl apply -k deploy/local-test
#
# The hostname is NOT overridden. Reach it by sending the Host header instead,
# which keeps the Ingress rule under test:
#   curl -H 'Host: voltway.splunko11y.com' http://localhost:8080/api/health
#
# The cert-manager annotation and tls block are also left alone. With no
# cert-manager installed the annotation is simply ignored, and Traefik serves its
# own self-signed cert on 443 while plain HTTP on 80 keeps working.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../k8s

# Locally built images rather than the published ones.
images:
  - name: ghcr.io/rungalileo/voltway-api
    newName: voltway-api
    newTag: local
  - name: ghcr.io/rungalileo/voltway-web
    newName: voltway-web
    newTag: local

patches:
  # imagePullPolicy: Always is correct in production but fatal here -- it would
  # ignore the image imported into the node and try to pull a tag that only
  # exists locally, giving ErrImagePull.
  - target:
      kind: Deployment
      name: voltway-api
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Deployment
      name: voltway-web
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent

  # Add `localhost` as a second hostname so the app is browsable at
  # http://localhost:8080 without editing /etc/hosts. The real
  # voltway.splunko11y.com rule is left in place and still takes the same
  # code path, so this adds local access rather than replacing what is tested.
  #
  # Both paths are duplicated deliberately: the /api -> backend split has to
  # exist on this hostname too, otherwise the page loads but every chat request
  # 404s against the frontend.
  - target:
      kind: Ingress
      name: voltway
    patch: |-
      - op: add
        path: /spec/rules/-
        value:
          host: localhost
          http:
            paths:
              - path: /api
                pathType: Prefix
                backend:
                  service:
                    name: voltway-api
                    port:
                      name: http
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: voltway-web
                    port:
                      name: http
