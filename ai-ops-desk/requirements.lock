# Fully-pinned dependency set, installed with --no-deps:
#
#   pip install --no-deps -r requirements.lock
#
# requirements.txt remains the human-readable statement of intent; this file is
# what actually gets installed in the container image.
#
# WHY A LOCKFILE IS REQUIRED (not just nice to have):
# agent-control-evaluators declares `sqlglot[c]<29.1.0,>=29.0.0`, and that `[c]`
# extra resolves to the `sqlglotc` C-accelerator package. Every 29.x release of
# sqlglotc has been removed from PyPI (only 30.x remain), so that requirement is
# now permanently unsatisfiable. Because agent-control-sdk and
# agent-control-engine both depend on agent-control-evaluators, ANY dependency
# resolution of requirements.txt now fails with:
#   ERROR: No matching distribution found for sqlglotc<29.1.0,>=29.0.0
# Installing with --no-deps skips resolution entirely and sidesteps it.
#
# sqlglotc is only an optional tokenizer speed-up — sqlglot ships a pure-Python
# fallback — so it is deliberately omitted below while plain sqlglot==29.0.1
# (the version the working environment used) is kept.
#
# Regenerate from a known-good virtualenv with:
#   pip freeze | grep -v '^sqlglotc==' > requirements.lock
# (then re-add this header)

